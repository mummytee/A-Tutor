name: Build A-Tutor APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Restore Permanent Keystore & Upload Signing Key
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "" | base64 -d > debug.keystore
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          rm -f my-upload-key.jks
          keytool -importkeystore \
            -srckeystore debug.keystore \
            -srcstorepass android \
            -srcalias androiddebugkey \
            -srckeypass android \
            -destkeystore my-upload-key.jks \
            -deststoretype PKCS12 \
            -deststorepass android \
            -destalias upload \
            -destkeypass android \
            -noprompt

      - name: Setup Environment Variables
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Restore Google Services Config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using committed app/google-services.json"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret"
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret"
          else
            echo "" | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from embedded project configuration"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK
        id: build_apk
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Align, Sign & Verify APK Asset
        id: sign_apk
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in app/build/outputs/apk/release/"
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS" ] || ! "$BUILD_TOOLS/zipalign" 2>&1 | grep -q "\-P <pagesize_kb>"; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --install "build-tools;36.0.0" >/dev/null || true
              BUILD_TOOLS=$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
            fi
          fi

          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/zipalign" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "Error: Android build-tools (zipalign/apksigner) not found under $SDK_ROOT"
            exit 1
          fi
          echo "Using build-tools: $BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$APK_FILE" release-assets/A-Tutor-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks my-upload-key.jks \
            --ks-key-alias upload \
            --ks-pass pass:android \
            --key-pass pass:android \
            --min-sdk-version 24 \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out release-assets/A-Tutor.apk \
            release-assets/A-Tutor-aligned.apk
          rm -f release-assets/A-Tutor-aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            --min-sdk-version 24 \
            -Werr \
            release-assets/A-Tutor.apk
          echo "Successfully aligned, signed (v2+v3 only), and verified release-assets/A-Tutor.apk"

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: always() && steps.build_apk.outcome == 'success' && steps.sign_apk.outcome == 'success'
        with:
          tag_name: latest
          name: "A-Tutor Latest Build (A-Tutor.apk)"
          body: |
            ### A-Tutor Android APK
            - **Direct Download**: Download `A-Tutor.apk` below directly to your phone.
            - **Version Code**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Build Date**: `${{ github.event.head_commit.timestamp || 'Latest' }}`
          prerelease: false
          make_latest: true
          files: release-assets/A-Tutor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact (Optional Fallback)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: A-Tutor
          path: release-assets/A-Tutor.apk
          retention-days: 14
