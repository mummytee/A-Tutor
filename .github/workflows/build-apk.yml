name: Build A-Tutor APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Restore Permanent Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "" | base64 -d > debug.keystore
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Setup Environment Variables
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        id: build_apk
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-assets/A-Tutor.apk
            echo "Successfully prepared A-Tutor.apk from $APK_FILE"
          else
            echo "Error: No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: always() && steps.build_apk.outcome == 'success'
        with:
          tag_name: latest
          name: "A-Tutor Latest Build (A-Tutor.apk)"
          body: |
            ### A-Tutor Android APK
            - **Direct Download**: Download `A-Tutor.apk` below directly to your phone.
            - **Version Code**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Build Date**: `${{ github.event.head_commit.timestamp || 'Latest' }}`
          prerelease: false
          make_latest: true
          files: release-assets/A-Tutor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact (Optional Fallback)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: A-Tutor
          path: release-assets/A-Tutor.apk
          retention-days: 14
